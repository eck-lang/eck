description = "Single authoritative ECK dialect – registers all builtin extensions into a Registry"

[dependencies]
language_core = { package = "eck-core", path = "../core" }
parser = { package = "eck-parser", path = "../parser" }
primitives = { package = "eck-primitives", path = "../primitives" }
